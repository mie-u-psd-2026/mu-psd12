<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>brAIn Storming</title>
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3.5.13/dist/vue.esm-browser.prod.js"
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="app"><p class="boot-message" role="status">Loading…</p></div>
  <noscript>Please enable JavaScript to use this app.</noscript>
  <script type="module">
    try {
      const [{ createApp }, { default: AppRoot }] = await Promise.all([
        import('vue'), import('/static/components/AppRoot.js'),
      ]);
      createApp(AppRoot).mount('#app');
    } catch (error) {
      document.querySelector('#app').textContent = 'Failed to load the page. Please make sure it is opened via the server, check your internet connection, and reload.';
      console.error(error);
    }
  </script>
</body>
</html>
